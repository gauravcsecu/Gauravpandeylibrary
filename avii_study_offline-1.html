<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#5b4bdb">
<title>GauravPandey — Offline Learning</title>
<style>
:root{--bg:#f6f7fb;--surface:#fff;--ink:#20213a;--muted:#7b8099;--line:#e9eaf3;--brand:#6254df;--brand2:#897cf5;--mint:#dff8ef;--peach:#fff0e5;--blue:#e9f1ff;--lav:#efedff;--shadow:0 12px 35px rgba(39,34,96,.07);--radius:20px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,select{font:inherit}button{cursor:pointer;border:0}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #b7b0ff;outline-offset:2px}
.app{min-height:100vh;display:grid;grid-template-columns:250px 1fr}.sidebar{background:#fff;border-right:1px solid var(--line);padding:26px 17px;display:flex;flex-direction:column;gap:28px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:11px;padding:0 10px}.brand-logo{width:48px;height:48px;object-fit:cover;object-position:center;border-radius:13px;border:1px solid var(--line);background:#fff}.brand-name{font-size:19px;font-weight:800;letter-spacing:-.5px}.brand-sub{font-size:11px;color:var(--muted);margin-top:-2px}
.nav-label{font-size:10px;letter-spacing:1.6px;font-weight:800;color:#a0a4b7;padding:0 13px;margin-bottom:8px}.nav{display:grid;gap:5px}.nav button{display:flex;align-items:center;gap:12px;width:100%;padding:12px 13px;border-radius:13px;background:transparent;color:#6d7189;text-align:left;font-weight:650}.nav button .ico{width:22px;text-align:center;font-size:17px}.nav button.active{background:var(--lav);color:var(--brand)}.nav button:hover:not(.active){background:#f8f8fc}.side-bottom{margin-top:auto}.offline-card{background:#f6f5ff;border:1px solid #eeecff;border-radius:16px;padding:14px}.offline-title{font-weight:750;font-size:13px}.offline-card p{font-size:12px;color:var(--muted);margin:5px 0 0}
main{min-width:0;padding:28px clamp(18px,4vw,54px) 48px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:30px}.crumb{font-size:12px;color:var(--muted);font-weight:650}.page-title{font-size:28px;letter-spacing:-1px;margin:3px 0 0;font-weight:850}.top-actions{display:flex;align-items:center;gap:10px}.pill{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 13px;color:#626780;font-size:12px;font-weight:700}.status-dot{width:7px;height:7px;border-radius:50%;background:#22b883}.avatar{width:38px;height:38px;border-radius:13px;background:#ffe4cf;color:#a45a2c;display:grid;place-items:center;font-weight:800}
.hero{background:linear-gradient(112deg,#5e50dc 0%,#7668eb 58%,#9a8df7 100%);color:#fff;border-radius:25px;padding:28px 30px;display:flex;align-items:center;justify-content:space-between;gap:20px;position:relative;overflow:hidden;box-shadow:0 16px 32px #6254df28}.hero:after{content:"";position:absolute;width:250px;height:250px;border:1px solid #ffffff2e;border-radius:50%;right:7%;top:-130px;box-shadow:0 0 0 28px #ffffff0c,0 0 0 58px #ffffff09}.hero-copy{position:relative;z-index:1}.eyebrow{text-transform:uppercase;letter-spacing:1.5px;font-size:10px;font-weight:850;opacity:.78}.hero h2{font-size:25px;line-height:1.2;letter-spacing:-.6px;margin:8px 0}.hero p{margin:0;opacity:.84;max-width:490px;font-size:13px}.hero-emoji{font-size:58px;position:relative;z-index:1;filter:drop-shadow(0 10px 14px #30249b35)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin:22px 0 30px}.stat{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:17px;display:flex;align-items:center;gap:13px}.stat-icon{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:19px}.stat:nth-child(1) .stat-icon{background:var(--lav)}.stat:nth-child(2) .stat-icon{background:var(--mint)}.stat:nth-child(3) .stat-icon{background:var(--peach)}.stat:nth-child(4) .stat-icon{background:var(--blue)}.stat-num{font-size:23px;font-weight:850;line-height:1.15}.stat-label{font-size:11px;color:var(--muted);font-weight:650;margin-top:4px}
.section-head{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:0 0 15px}.section-head h3{margin:0;font-size:18px;letter-spacing:-.4px}.section-head p{margin:3px 0 0;color:var(--muted);font-size:12px}.text-btn{background:transparent;color:var(--brand);font-weight:750;font-size:12px}
.module-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.module{border:1px solid var(--line);background:#fff;border-radius:19px;padding:18px;text-align:left;transition:.18s;min-width:0}.module:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:#d9d5ff}.module-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.module-icon{width:43px;height:43px;border-radius:14px;display:grid;place-items:center;font-size:21px}.module:nth-child(1) .module-icon{background:var(--lav)}.module:nth-child(2) .module-icon{background:var(--mint)}.module:nth-child(3) .module-icon{background:var(--peach)}.module:nth-child(4) .module-icon{background:var(--blue)}.arrow{color:#a2a5b6;font-size:18px}.module h4{font-size:15px;margin:0 0 5px}.module p{font-size:11px;color:var(--muted);margin:0;min-height:33px}.module-count{font-size:11px;color:#777c96;font-weight:700;margin-top:15px}
.content-panel{background:#fff;border:1px solid var(--line);border-radius:22px;padding:22px;margin-top:22px}.filter-row{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.field{background:#fafaff;border:1px solid #e6e7f1;border-radius:12px;padding:10px 12px;color:#4e536d;min-width:155px}.search-field{flex:1;min-width:190px}.list{display:grid;gap:12px}.item{border:1px solid var(--line);border-radius:16px;padding:17px 18px;background:#fff}.item-head{display:flex;align-items:start;justify-content:space-between;gap:10px}.item h4{margin:0;font-size:15px}.tag{display:inline-flex;align-items:center;border-radius:999px;padding:4px 8px;background:#f0efff;color:#6254c8;font-size:10px;font-weight:800;white-space:nowrap}.item p{margin:10px 0 0;color:#5e637d;font-size:13px;white-space:pre-wrap}.answer-options{display:grid;gap:8px;margin-top:14px}.option{display:flex;gap:10px;align-items:flex-start;padding:11px 12px;border:1px solid #e8e9f2;border-radius:12px;background:#fff;text-align:left;color:#454a63;font-size:13px}.option.selected{border-color:#7a6df0;background:#f3f1ff}.option.correct{border-color:#6bc9a4;background:#effbf5}.option.wrong{border-color:#f19b9b;background:#fff3f2}.option-letter{width:23px;height:23px;border-radius:8px;background:#f0f1f7;display:grid;place-items:center;flex-shrink:0;font-size:11px;font-weight:800}.explanation{margin-top:13px;padding:13px;border-radius:12px;background:#f2fbf6;border:1px solid #d9f3e5;color:#306b53;font-size:12px}.submit-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:13px}.primary{background:var(--brand);color:#fff;padding:10px 16px;border-radius:11px;font-weight:750;font-size:12px;box-shadow:0 5px 12px #6254df25}.primary:hover{background:#5042cc}.secondary{background:#f1f0ff;color:#5c4ed0;padding:10px 14px;border-radius:11px;font-weight:750;font-size:12px}.muted{color:var(--muted);font-size:12px}.empty{padding:35px 15px;text-align:center;color:var(--muted)}.empty .empty-icon{font-size:32px;margin-bottom:8px}.empty h4{color:var(--ink);margin:0 0 5px}.empty p{margin:0;font-size:12px}
.import-layout{display:grid;grid-template-columns:1.1fr .9fr;gap:18px}.dropzone{border:1.5px dashed #c9c5f6;background:#faf9ff;border-radius:18px;padding:28px;text-align:center}.drop-icon{font-size:30px}.dropzone h4{margin:8px 0 4px}.dropzone p{font-size:12px;color:var(--muted);margin:0 auto 15px;max-width:350px}.package-card{border:1px solid var(--line);border-radius:15px;padding:14px;margin-top:10px;display:flex;align-items:center;justify-content:space-between;gap:12px}.package-card h4{margin:0;font-size:13px}.package-card p{margin:3px 0 0;font-size:11px;color:var(--muted)}.danger{background:#fff0f0;color:#c54b4b;padding:8px 10px;border-radius:9px;font-size:11px;font-weight:800}.notice{padding:12px 14px;border-radius:12px;background:#fff8e9;color:#89651b;font-size:11px;margin-top:14px}.success{background:#edfbf4;color:#267a55;padding:10px 12px;border-radius:10px;font-size:12px;margin-top:12px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#252442;color:#fff;border-radius:12px;padding:12px 18px;box-shadow:var(--shadow);z-index:20;font-size:12px;display:none;max-width:90vw}
.mobile-menu{display:none}.footer-note{color:#a0a4b7;font-size:10px;margin-top:25px;text-align:center}
@media(max-width:1050px){.stats,.module-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.app{grid-template-columns:220px 1fr}.import-layout{grid-template-columns:1fr}}
@media(max-width:720px){.app{display:block}.sidebar{position:fixed;z-index:10;left:-270px;top:0;width:250px;transition:left .2s;box-shadow:var(--shadow)}.sidebar.open{left:0}.mobile-menu{display:grid;place-items:center;background:#fff;border:1px solid var(--line);border-radius:11px;width:38px;height:38px;font-size:18px}.topbar{align-items:start;margin-bottom:20px}.page-title{font-size:24px}.top-actions .pill{display:none}main{padding:18px 15px 35px}.hero{padding:22px}.hero h2{font-size:21px}.hero-emoji{font-size:43px}.stats{gap:9px;margin:15px 0 24px}.stat{padding:12px;gap:9px}.stat-icon{width:34px;height:34px;font-size:16px}.stat-num{font-size:20px}.stat-label{font-size:10px}.module-grid{gap:10px}.module{padding:14px}.content-panel{padding:15px}.filter-row{gap:8px}.field{min-width:0;flex:1}.search-field{flex-basis:100%}.avatar{width:34px;height:34px}.section-head{align-items:start}}
</style>
</head>

<script>
const DB_KEY='avii.study.packages.v1';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const readDB=()=>{try{return JSON.parse(localStorage.getItem(DB_KEY)||'[]')}catch{return []}};
const saveDB=d=>localStorage.setItem(DB_KEY,JSON.stringify(d));
let currentView='home', activePackage='all', currentFilter={subject:'all',chapter:'all',search:''}, selectedAnswers={}, submitted={};
function toast(msg){const t=$('#toast');t.textContent=msg;t.style.display='block';clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.style.display='none',2600)}
function allItems(type){return readDB().flatMap(pkg=>(pkg.data[type]||[]).map((item,i)=>({...item,_pkgId:pkg.id,_pkgName:pkg.name,_key:pkg.id+':'+type+':'+(item.id??i)})))}
function uniqueVals(items,key){return [...new Set(items.map(x=>x[key]).filter(Boolean))].sort((a,b)=>String(a).localeCompare(String(b)))}
function getFiltered(type){let arr=allItems(type);if(activePackage!=='all')arr=arr.filter(x=>x._pkgId===activePackage);if(currentFilter.subject!=='all')arr=arr.filter(x=>x.subject===currentFilter.subject);if(currentFilter.chapter!=='all')arr=arr.filter(x=>x.chapter===currentFilter.chapter);if(currentFilter.search){const q=currentFilter.search.toLowerCase();arr=arr.filter(x=>[x.title,x.question,x.content,x.notes,x.explanation,x.subject,x.chapter,x.topic].some(v=>String(v||'').toLowerCase().includes(q)))}return arr}
const typeMeta={READ:{title:'Read notes',subtitle:'Build strong foundations with complete, chapter-wise notes.',icon:'📚',desc:'Complete concepts and detailed notes'},MCQ:{title:'Practice MCQs',subtitle:'Choose an option, submit your answer, then review the explanation.',icon:'🎯',desc:'Practice with explained answers'},SHORT:{title:'Short revision',subtitle:'Compact revision notes for your final rounds.',icon:'⚡',desc:'Quick recall, less scrolling'},TRAP:{title:'Key differences',subtitle:'Terminology, comparisons and exam traps at a glance.',icon:'🧠',desc:'Distinguish concepts that look similar'}};
function setView(view){currentView=view;currentFilter={subject:'all',chapter:'all',search:''};selectedAnswers={};submitted={};$('#sidebar').classList.remove('open');render()}
function render(){document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===currentView));if(currentView==='home'){ $('#crumb').textContent='YOUR WORKSPACE / OVERVIEW';$('#pageTitle').textContent='Good evening, learner ✨';renderHome()}else if(currentView==='library'){ $('#crumb').textContent='YOUR LIBRARY / DATA MANAGER';$('#pageTitle').textContent='Import & Export';renderLibrary()}else{const m=typeMeta[currentView];$('#crumb').textContent='STUDY SPACE / '+currentView;$('#pageTitle').textContent=m.title;renderStudy(currentView)}}
function renderHome(){const counts=['READ','MCQ','SHORT','TRAP'].map(t=>allItems(t).length),pkgs=readDB();$('#viewRoot').innerHTML=`
<section class="hero"><div class="hero-copy"><div class="eyebrow">YOUR PERSONAL LEARNING HUB</div><h2>Small steps. Strong concepts.<br>Big results.</h2><p>Everything you need to study, revise and practise — organised your way, even without internet.</p></div><div class="hero-emoji">🚀</div></section>
<section class="stats"><div class="stat"><div class="stat-icon">📚</div><div><div class="stat-num">${counts[0]}</div><div class="stat-label">READ NOTES</div></div></div><div class="stat"><div class="stat-icon">🎯</div><div><div class="stat-num">${counts[1]}</div><div class="stat-label">PRACTICE MCQs</div></div></div><div class="stat"><div class="stat-icon">⚡</div><div><div class="stat-num">${counts[2]}</div><div class="stat-label">SHORT NOTES</div></div></div><div class="stat"><div class="stat-icon">🧠</div><div><div class="stat-num">${counts[3]}</div><div class="stat-label">TRAPS & TERMS</div></div></div></section>
<div class="section-head"><div><h3>Your study tools</h3><p>Pick a mode and keep moving forward.</p></div><button class="text-btn" data-action="library">Manage content ↗</button></div>
<section class="module-grid">${Object.entries(typeMeta).map(([t,m])=>`<button class="module" data-action="${t}"><div class="module-top"><div class="module-icon">${m.icon}</div><span class="arrow">↗</span></div><h4>${m.title}</h4><p>${m.desc}</p><div class="module-count">${counts[['READ','MCQ','SHORT','TRAP'].indexOf(t)]} items available</div></button>`).join('')}</section>
<section class="content-panel"><div class="section-head"><div><h3>Your content library</h3><p>${pkgs.length} imported content ${pkgs.length===1?'version':'versions'}</p></div><button class="secondary" data-action="library">＋ Import JSON</button></div>${pkgs.length?pkgs.slice().reverse().slice(0,3).map(p=>`<div class="package-card"><div><h4>${esc(p.name)}</h4><p>Version ${esc(p.version)} · Imported ${esc(new Date(p.importedAt).toLocaleDateString())}</p></div><span class="tag">${Object.values(p.data).reduce((n,a)=>n+(a?.length||0),0)} items</span></div>`).join(''):`<div class="empty"><div class="empty-icon">🗂️</div><h4>Your library is ready</h4><p>Import a JSON content pack to see your notes and questions here.</p><br><button class="primary" data-action="library">Import your first pack</button></div>`}</section>`}
function filterControls(type){const items=allItems(type),subjects=uniqueVals(items,'subject'),chapters=uniqueVals(items,'chapter'),pkgs=readDB();return `<div class="filter-row"><select class="field" id="packageFilter"><option value="all">All versions</option>${pkgs.map(p=>`<option value="${esc(p.id)}" ${activePackage===p.id?'selected':''}>${esc(p.name)} · v${esc(p.version)}</option>`).join('')}</select><select class="field" id="subjectFilter"><option value="all">All subjects</option>${subjects.map(s=>`<option ${currentFilter.subject===s?'selected':''} value="${esc(s)}">${esc(s)}</option>`).join('')}</select><select class="field" id="chapterFilter"><option value="all">All chapters</option>${chapters.map(s=>`<option ${currentFilter.chapter===s?'selected':''} value="${esc(s)}">${esc(s)}</option>`).join('')}</select><input class="field search-field" id="searchFilter" placeholder="Search topic, concept or keyword…" value="${esc(currentFilter.search)}"></div>`}
function renderStudy(type){const m=typeMeta[type],items=getFiltered(type);$('#viewRoot').innerHTML=`<section class="hero"><div class="hero-copy"><div class="eyebrow">STUDY MODE · ${type}</div><h2>${m.title}</h2><p>${m.subtitle}</p></div><div class="hero-emoji">${m.icon}</div></section><section class="content-panel"><div class="section-head"><div><h3>Explore your content</h3><p>Filter by subject and chapter to focus your session.</p></div><span class="tag">${items.length} results</span></div>${filterControls(type)}<div class="list" id="itemList">${items.length?items.map((item,i)=>renderItem(type,item,i)).join(''):`<div class="empty"><div class="empty-icon">🗂️</div><h4>No content found yet</h4><p>Import a JSON pack or adjust your filters to find content.</p><br><button class="primary" data-action="library">Open Import & Export</button></div>`}</div></section>`;bindFilters()}
function renderItem(type,x,i){let title=x.title||x.topic||x.question||`Item ${i+1}`,body=x.content||x.notes||x.note||x.definition||'';if(type==='MCQ'){let opts=Array.isArray(x.options)?x.options:[],key=x._key,done=!!submitted[key],chosen=selectedAnswers[key];return `<article class="item"><div class="item-head"><div><h4>${i+1}. ${esc(x.question||x.title||'Untitled question')}</h4><p class="muted" style="margin-top:5px">${esc(x.subject||'General')} · ${esc(x.chapter||'Uncategorised')}</p></div><span class="tag">${esc(x.difficulty||'Practice')}</span></div><div class="answer-options">${opts.map((o,j)=>{let text=typeof o==='string'?o:(o.text||o.option||JSON.stringify(o)),correct=j===answerIndex(x),cls=done?(correct?'correct':(chosen===j?'wrong':'')):(chosen===j?'selected':'');return `<button class="option ${cls}" data-answer="${esc(key)}" data-index="${j}" ${done?'disabled':''}><span class="option-letter">${String.fromCharCode(65+j)}</span><span>${esc(text)}</span></button>`}).join('')}</div><div class="submit-row"><span class="muted">${done?(chosen===answerIndex(x)?'✓ Correct answer':'Answer submitted'):'Select one option'}</span><button class="primary" data-submit="${esc(key)}" ${done?'disabled':''}>${done?'Submitted':'Submit answer'}</button></div>${done?`<div class="explanation"><strong>${chosen===answerIndex(x)?'Correct!':'Explanation'}</strong><br>${esc(x.explanation||x.solution||'No explanation was provided in this content pack.')}${x.answer!==undefined||x.correctAnswer!==undefined?`<br><br><strong>Answer:</strong> ${esc(answerText(x))}`:''}</div>`:''}</article>`}
return `<article class="item"><div class="item-head"><div><h4>${esc(title)}</h4><p class="muted" style="margin-top:5px">${esc(x.subject||'General')} · ${esc(x.chapter||'Uncategorised')}${x.topic&&x.title?' · '+esc(x.topic):''}</p></div><span class="tag">${type==='READ'?'Complete note':type==='SHORT'?'Quick revision':'Terminology'}</span></div>${body?`<p>${esc(body)}</p>`:''}${x.keyDifference?`<p><strong>Key difference:</strong> ${esc(x.keyDifference)}</p>`:''}${x.example?`<p><strong>Example:</strong> ${esc(x.example)}</p>`:''}${x.trap?`<p><strong>Exam trap:</strong> ${esc(x.trap)}</p>`:''}${x.explanation?`<p><strong>Explanation:</strong> ${esc(x.explanation)}</p>`:''}${x.points&&Array.isArray(x.points)?`<ul>${x.points.map(p=>`<li>${esc(p)}</li>`).join('')}</ul>`:''}</article>`}
function answerIndex(x){let a=x.correctAnswer??x.answer??x.correctOption??x.correctIndex;if(typeof a==='number')return a>=1&&a<=((x.options||[]).length)&&x.correctIndex===undefined&&x.correctAnswer===undefined?a-1:a;if(typeof a==='string'){let s=a.trim();if(/^[A-Z]$/i.test(s))return s.toUpperCase().charCodeAt(0)-65;let ix=(x.options||[]).findIndex(o=>(typeof o==='string'?o:o.text)===s);if(ix>=0)return ix;let n=Number(s);if(Number.isInteger(n))return n>=1?n-1:n}return -1}
function answerText(x){let i=answerIndex(x),o=(x.options||[])[i];return o===undefined?String(x.correctAnswer??x.answer??'Not specified'):(typeof o==='string'?o:o.text||o.option||String(o))}
function bindFilters(){['packageFilter','subjectFilter','chapterFilter','searchFilter'].forEach(id=>{const el=$('#'+id);if(!el)return;el.addEventListener(id==='searchFilter'?'input':'change',()=>{const value=el.value;if(id==='packageFilter')activePackage=value;if(id==='subjectFilter')currentFilter.subject=value;if(id==='chapterFilter')currentFilter.chapter=value;if(id==='searchFilter'){currentFilter.search=value;const pos=el.selectionStart;renderStudy(currentView);const next=$('#searchFilter');next.focus();next.setSelectionRange(pos,pos)}else renderStudy(currentView)})})}
function renderLibrary(){const pkgs=readDB();$('#viewRoot').innerHTML=`<section class="hero"><div class="hero-copy"><div class="eyebrow">CONTENT MANAGEMENT</div><h2>Your library, your rules.</h2><p>Import JSON packs you create with ChatGPT. Keep versions separate, export a backup, or remove a pack when you no longer need it.</p></div><div class="hero-emoji">🗃️</div></section><section class="content-panel"><div class="section-head"><div><h3>Bring your study content</h3><p>Works offline after the app is saved on your device.</p></div></div><div class="import-layout"><div class="dropzone"><div class="drop-icon">📥</div><h4>Import a JSON pack</h4><p>Choose a .json file containing READ, MCQ, SHORT and TRAP items. Each import is saved as its own version.</p><button class="primary" id="chooseFile">Choose JSON file</button><div id="importMessage"></div></div><div><h4 style="margin:2px 0 8px">JSON format guide</h4><p class="muted">A pack can include any combination of the four content types. Use arrays for each section.</p><pre style="white-space:pre-wrap;overflow-wrap:anywhere;background:#f7f7fc;padding:13px;border-radius:12px;font-size:10px;color:#565b78">{
  "name": "Computer Networks",
  "version": "1.0",
  "data": {
    "READ": [{"subject":"CN","chapter":"TCP","title":"TCP basics","content":"..."}],
    "MCQ": [{"subject":"CN","chapter":"TCP","question":"...","options":["A","B","C","D"],"correctAnswer":"B","explanation":"..."}],
    "SHORT": [],
    "TRAP": []
  }
}</pre><button class="secondary" id="downloadTemplate">Download sample JSON</button></div></div><div class="notice">Important: deleting a pack removes its content and version record from this app. Files you previously exported/downloaded are outside the app's control and must be deleted from your device separately.</div></section><section class="content-panel"><div class="section-head"><div><h3>Imported versions</h3><p>${pkgs.length} ${pkgs.length===1?'version':'versions'} stored locally on this device</p></div><button class="secondary" id="exportAll">Export all packs</button></div>${pkgs.length?pkgs.slice().reverse().map(p=>`<div class="package-card"><div style="min-width:0"><h4>${esc(p.name)}</h4><p>Version ${esc(p.version)} · ${Object.values(p.data).reduce((n,a)=>n+(a?.length||0),0)} items · ${esc(new Date(p.importedAt).toLocaleString())}</p><p style="overflow-wrap:anywhere">ID: ${esc(p.id)}</p></div><div style="display:flex;gap:7px;flex-shrink:0"><button class="secondary" data-export="${esc(p.id)}">Export</button><button class="danger" data-delete="${esc(p.id)}">Delete</button></div></div>`).join(''):`<div class="empty"><div class="empty-icon">📦</div><h4>No imported versions</h4><p>Import your first JSON pack to populate the study modes.</p></div>`}</section>`;$('#chooseFile').onclick=()=>$('#fileInput').click();$('#downloadTemplate').onclick=downloadTemplate;$('#exportAll').onclick=exportAll;document.querySelectorAll('[data-export]').forEach(b=>b.onclick=()=>exportPackage(b.dataset.export));document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>deletePackage(b.dataset.delete))}
function normalizePack(raw){if(!raw||typeof raw!=='object')throw Error('The JSON root must be an object.');let data=raw.data||raw;if(!data||typeof data!=='object')throw Error('Missing content data.');const clean={};for(const t of ['READ','MCQ','SHORT','TRAP']){let arr=data[t]??data[t.toLowerCase()]??[];if(!Array.isArray(arr))throw Error(`${t} must be an array.`);clean[t]=arr.map((x,i)=>{if(!x||typeof x!=='object'||Array.isArray(x))throw Error(`${t} item ${i+1} must be an object.`);if(t==='MCQ'&&(!x.question&&!x.title))throw Error(`MCQ item ${i+1} needs a question or title.`);if(t==='MCQ'&&(!Array.isArray(x.options)||x.options.length<2))throw Error(`MCQ item ${i+1} needs at least two options.`);return {...x,subject:x.subject||'General',chapter:x.chapter||'Uncategorised'}})}return {name:String(raw.name||raw.title||'Imported Study Pack'),version:String(raw.version||'1.0'),data:clean}}
$('#fileInput').addEventListener('change',async e=>{const file=e.target.files?.[0];if(!file)return;try{const raw=JSON.parse(await file.text()),pkgs=readDB();if(raw.format==='avii-study-library'&&Array.isArray(raw.packages)){let added=0;for(const item of raw.packages){const norm=normalizePack(item),id='pack_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,7);pkgs.push({id,name:norm.name,version:norm.version,importedAt:new Date().toISOString(),data:norm.data});added++}if(!added)throw Error('No packages found in backup.');saveDB(pkgs);toast(`Restored ${added} pack${added===1?'':'s'} from backup`)}else{const norm=normalizePack(raw),id='pack_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,7);pkgs.push({id,name:norm.name,version:norm.version,importedAt:new Date().toISOString(),data:norm.data});saveDB(pkgs);toast(`Imported ${norm.name} · v${norm.version}`)}renderLibrary()}catch(err){toast('Import failed: '+err.message)}finally{e.target.value=''}});
function downloadJSON(obj,name){const blob=new Blob([JSON.stringify(obj,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function exportPackage(id){const p=readDB().find(x=>x.id===id);if(!p)return;downloadJSON({name:p.name,version:p.version,exportedAt:new Date().toISOString(),data:p.data},`${safeName(p.name)}-v${safeName(p.version)}.json`);toast('Version exported')}
function exportAll(){const pkgs=readDB();if(!pkgs.length){toast('Nothing to export yet');return}downloadJSON({format:'avii-study-library',formatVersion:1,exportedAt:new Date().toISOString(),packages:pkgs.map(({id,name,version,importedAt,data})=>({id,name,version,importedAt,data}))},'avii-study-library-backup.json');toast('Library backup exported')}
function safeName(s){return String(s).replace(/[^a-z0-9._-]+/gi,'-').replace(/^-|-$/g,'')||'pack'}
function deletePackage(id){const p=readDB().find(x=>x.id===id);if(!p)return;if(!confirm(`Delete "${p.name}" version ${p.version}?\n\nAll content and its version record will be removed from this app. Previously downloaded export files cannot be deleted by the app.`))return;saveDB(readDB().filter(x=>x.id!==id));if(activePackage===id)activePackage='all';toast('Pack and its app-stored content deleted');renderLibrary()}
function downloadTemplate(){downloadJSON({name:'ISRO CS Study Pack',version:'1.0',data:{READ:[{subject:'Computer Networks',chapter:'Transport Layer',title:'TCP overview',content:'Add your complete notes here.'}],MCQ:[{subject:'Computer Networks',chapter:'Transport Layer',question:'Which protocol provides reliable, connection-oriented delivery?',options:['UDP','TCP','IP','ARP'],correctAnswer:'B',explanation:'TCP provides reliable, connection-oriented byte-stream delivery.'}],SHORT:[{subject:'Computer Networks',chapter:'Transport Layer',title:'TCP — quick recall',content:'Connection-oriented; reliable; ordered byte stream.'}],TRAP:[{subject:'Computer Networks',chapter:'Transport Layer',title:'TCP vs UDP',keyDifference:'TCP is reliable and connection-oriented; UDP is connectionless and best-effort.',trap:'UDP can still be used by applications that implement reliability themselves.'}] }},'avii-study-sample.json')}
$('#nav').addEventListener('click',e=>{const b=e.target.closest('button[data-view]');if(b)setView(b.dataset.view)});$('#menuBtn').onclick=()=>$('#sidebar').classList.toggle('open');$('#viewRoot').addEventListener('click',e=>{const act=e.target.closest('[data-action]');if(act){setView(act.dataset.action);return}const opt=e.target.closest('[data-answer]');if(opt){const key=opt.dataset.answer;if(submitted[key])return;selectedAnswers[key]=Number(opt.dataset.index);renderStudy(currentView);return}const sub=e.target.closest('[data-submit]');if(sub){const key=sub.dataset.submit;if(selectedAnswers[key]===undefined){toast('Choose an option first');return}submitted[key]=true;renderStudy(currentView)}});render();
</script>
</body>
</html>
